<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Title and description are filled from content.js -->
  <title></title>
  <meta name="description" content="" />
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!-- Styles: base first, then shared pieces, then one file per part of the page -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/loader.css" />
  <link rel="stylesheet" href="css/nav.css" />
  <link rel="stylesheet" href="css/rail.css" />
  <link rel="stylesheet" href="css/hero.css" />
  <link rel="stylesheet" href="css/about.css" />
  <link rel="stylesheet" href="css/projects.css" />
  <link rel="stylesheet" href="css/experience.css" />
  <link rel="stylesheet" href="css/skills.css" />
  <link rel="stylesheet" href="css/contact.css" />
</head>
<body>
  <!-- Preloader: the logo assembles along its own slash -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader-logo">
      <img src="assets/logo.png" alt="" class="half half-top" />
      <img src="assets/logo.png" alt="" class="half half-bot" />
    </div>
    <div class="loader-bar"><span></span></div>
  </div>

  <canvas id="field" aria-hidden="true"></canvas>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a href="#top" class="nav-brand" id="brand">
      <img src="assets/logo.png" alt="" class="brand-mark" />
      <span data-slot="brand"></span>
    </a>
    <div class="nav-contacts" id="navContacts"></div>
  </header>

  <!-- Side scroll slider: drag the thumb or click a stop (filled by js/render.js, driven by js/rail.js) -->
  <nav class="rail" id="rail" aria-label="Sections">
    <div class="rail-track" id="railTrack">
      <div class="rail-fill" id="railFill"></div>
      <div class="rail-stops" id="railStops"></div>
      <div class="rail-thumb" id="railThumb" role="slider" tabindex="0" aria-label="Page position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
    </div>
  </nav>

  <main id="top">
    <!-- HERO -->
    <section class="hero">
      <!-- 1. Floating logo, centred -->
      <div class="hero-visual" id="heroVisual">
        <!-- 3D tech-logo orbits (filled by js/render.js, animated by js/orbit.js) -->
        <div class="orbit3d" id="orbit3d" aria-hidden="true"></div>
        <div class="logo-glow"></div>
        <div class="logo-float">
          <div class="logo-stage" id="logoStage">
            <!-- Hidden phrase in the slash: shows when the halves split on hover / tap -->
            <span class="logo-secret" id="logoSecret"></span>
            <img src="assets/logo.png" alt="" class="logo-main half-top" id="heroLogo" />
            <img src="assets/logo.png" alt="" class="logo-main half-bot" />
            <div class="slash-flash"></div>
          </div>
        </div>
      </div>

      <!-- 2. Name, then everything else -->
      <div class="hero-text">
        <h1 class="hero-title">
          <span class="line"><span class="word" data-scramble data-slot="hero.firstName"></span></span>
          <span class="line"><span class="word grad" data-scramble data-slot="hero.lastName"></span></span>
        </h1>
        <ul class="hero-keys reveal" id="heroKeys"></ul>
        <div class="hero-cta reveal">
          <a class="btn btn-primary" id="ctaPrimary"><span></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a class="btn btn-light" id="ctaSecondary"><span></span></a>
        </div>
        <p class="eyebrow reveal"><span class="pulse"></span><span data-slot="hero.status"></span></p>
      </div>

    </section>

    <div class="slash-divider" aria-hidden="true"></div>

    <!-- ABOUT -->
    <section id="about" class="section band">
      <div class="section-head reveal" data-head="about"></div>
      <div class="about-grid">
        <div class="about-copy reveal" id="aboutCopy"></div>
        <div class="stats" id="stats"></div>
      </div>
      <!-- Contact card: part of About, styled like the stat cards -->
      <div class="contact-card reveal" id="contact">
        <h2 class="contact-title"><span data-slot="contact.titleLine1"></span> <span class="grad" data-slot="contact.titleLine2"></span></h2>
        <div class="contact-actions">
          <a class="contact-mail" id="contactMail"></a>
          <div class="socials" id="socials"></div>
        </div>
      </div>

      <!-- Skills: part of About, under a smaller sub-heading -->
      <div class="about-skills" id="skills">
        <div class="section-head sub-head reveal" data-head="skills"></div>
        <div class="toolkit tilt reveal" id="toolkit" data-glow data-tilt="3"></div>
        <p class="tk-more reveal" data-slot="skills.more"></p>
      </div>
    </section>

    <!-- EXPERIENCE -->
    <section id="experience" class="section">
      <div class="section-head reveal" data-head="experience"></div>
      <div class="timeline" id="timeline"></div>
    </section>

    <!-- PROJECTS -->
    <section id="projects" class="section">
      <div class="section-head reveal" data-head="projects"></div>
      <div class="carousel reveal" id="projectCarousel">
        <div class="carousel-track" id="projectTrack"></div>
        <div class="carousel-controls">
          <button class="carousel-btn" data-dir="-1" aria-label="Previous project"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
          <div class="carousel-dots"></div>
          <button class="carousel-btn" data-dir="1" aria-label="Next project"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <img src="assets/logo.png" alt="" />
    <span id="footerText"></span>
    <a href="#top" class="to-top"><span data-slot="footer.backToTop"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></a>
  </footer>

  <!-- 1. Editable content -->
  <script src="content.js"></script>
  <!-- 2. Helpers + feature modules (each registers itself on window.App) -->
  <script src="js/utils.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/render.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/shootingstar.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/rail.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/carousel.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/logo-secret.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/orbit.js"></script>
  <!-- 3. Boot: render content, then start features -->
  <script src="js/main.js"></script>
</body>
</html>
